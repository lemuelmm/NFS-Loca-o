*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Roboto,Helvetica,Arial,sans-serif;background:#F7F7F7;color:#444}
button{border:0;background:none;cursor:pointer;font-family:inherit}

  let vl=0, alug=0, obr=0, bc=0, antes=0, cbs=0, ibsE=0, ibsM=0, pcbs=0, pibsE=0, pibsM=0;
  nt.itens.forEach(function(p){
    const c = calc(p);
    vl += c.vTotOper; alug += c.vAluguel; obr += c.vObrig; bc += c.vBC; antes += c.baseAntesFed;
    cbs+=c.cbs; ibsE+=c.ibsE; ibsM+=c.ibsM;
    const a = previsto(p);
    if(a){ pcbs+=a.cbs; pibsE+=a.ibsE; pibsM+=a.ibsM; }
  });
  return {vl:r2(vl), alug:r2(alug), obr:r2(obr), bc:r2(bc), antes:r2(antes),
          cbs:r2(cbs), ibsE:r2(ibsE), ibsM:r2(ibsM),
          pcbs:r2(pcbs), pibsE:r2(pibsE), pibsM:r2(pibsM)};
}

function notaSemPrev(nt){ return nt.itens.some(function(p){ return !temPrevisao(p); }); }

  const l = [];
  nt.itens.forEach(function(p){
    l.push({p:p, t:(nt.uns.length>1 ? p.un+', ' : '')+'Aluguel', vl:p.vl, aj:null});

const MODOS = {
  contrato:  {t:'Contrato',            pag:'Contratos por página',  um:'contrato',  uns:'contratos',
              chave:function(p){ return p.ct; }},
  locmun:    {t:'Locatário e município', pag:'Grupos por página', um:'grupo', uns:'grupos',
              chave:function(p){ return p.cli+'|'+ccDe(p.cc).cmun; }}
};
function fechados(){ return S.fechados[S.agrupar]; }
function blocos(lista){
  const modo = S.agrupar, M = MODOS[modo];
  const bl = [], por = {};
  lista.forEach(function(p){
    const ch = M.chave(p), cc = ccDe(p.cc);
    if(!por[ch]){
      por[ch] = {tipo:modo, k:modo+':'+ch,
                 rot: modo==='contrato' ? p.ct : p.cli+' · '+cc.mun+' - '+cc.uf,
                 cli:p.cli, itens:[], muns:{}, cts:{}, ordCt:[], enteGov:false};
      bl.push(por[ch]);
    }
    const B = por[ch];
    B.itens.push(p);
    B.muns[cc.cmun] = cc.mun+' · '+cc.uf;
    if(!B.cts[p.ct]){ B.cts[p.ct] = {ct:p.ct, cli:p.cli, loc:[], obr:[], muns:{}, enteGov:false}; B.ordCt.push(p.ct); }
    const C = B.cts[p.ct];
    (ehAluguel(p) ? C.loc : C.obr).push(p);
    C.muns[cc.cmun] = 1;
    if(p.enteGov){ B.enteGov = true; C.enteGov = true; }
  });
  bl.forEach(function(B){
    B.multiCidade = Object.keys(B.muns).length > 1;
    if(modo !== 'contrato') B.ordCt.sort();
    B.contratos = B.ordCt.map(function(ct){ return B.cts[ct]; });
    B.contratos.forEach(function(C){
      C.multiCidade = Object.keys(C.muns).length > 1;
      C.loc.sort(function(a,b){ return a.un.localeCompare(b.un,'pt-BR',{numeric:true}); });
      C.obr.sort(function(a,b){
        if(a.to !== b.to) return a.to.localeCompare(b.to,'pt-BR');
        return a.venc.localeCompare(b.venc);
      });
    });
  });
  if(modo !== 'contrato'){
    bl.sort(function(a,b){ return a.rot.localeCompare(b.rot,'pt-BR'); });
  }
  return bl;
}
function agregadoItens(itens){
  const alug = itens.filter(ehAluguel);
  const obr  = itens.filter(function(p){ return !ehAluguel(p); });
  const vAl = r2(alug.reduce(function(s,p){ return s+p.vl; }, 0));
  const vOb = r2(obr.reduce(function(s,p){ return s+p.vl; }, 0));
  return {alug:alug.length, obr:obr.length, notas:grupos(alug).length,
          vAl:vAl, vOb:vOb, vl:r2(vAl+vOb)};
}

  const v = dt(venc);
  if(!v) return null;
  if(a.modo === 'antes'){ const d = new Date(v.getTime()); d.setDate(d.getDate() - (a.dias||0)); return d; }

    S.ag.forEach(function(a){
      if(!a.ativo || a.emps.indexOf(p.emp) < 0 || a.ccs.indexOf(p.cc) < 0) return;
      const v = dt(p.venc), ini = dt(a.ini), fim = dt(a.fim);

function motivoBloqueio(p){
  const b = bloqueioDeCadastro(p);
  if(b) return b.msg + ' Enquanto o CIB estiver fora do formato a tela não deixa emitir. Quem corrige: ' + b.quem + '.';
  if(!p.nota) return '';
  const e = p.nota.est;
  if(e === 'Denegada')
    return 'Nota denegada. É rejeição definitiva e saída terminal: não se resolve por edição e reenvio. '
         + 'A parcela não volta para o lote.';
  if(e === 'Em processamento')
    return 'Nota transmitida, aguardando o retorno do órgão. Nota transmitida não é nota confirmada, '
         + 'e emitir de novo geraria segunda chave para a mesma parcela.';
  if(e === 'Aguardando cancelamento')
    return 'Cancelamento pedido, aguardando o retorno do órgão. A parcela segue bloqueada nesse intervalo.';
  if(e === 'Substituída')
    return 'Esta nota foi substituída. A parcela aponta para a nota vigente, que é a substituta, '
         + 'e é o estado dela que vale.';
  return 'Parcela com nota fiscal emitida. Ela usa as mesmas validações de uma parcela com baixa total: '
       + 'bloqueia reajuste, aditivo, reparcelamento, cessão de direitos e qualquer alteração de valor. '
       + 'A parcela segue em aberto. Só destrava com o cancelamento da nota.';
}

function linhaCmp(k, va, vb){
  const d = r2(vb-va);
  return '<tr><td>'+k+'</td><td class="num">'+m(va)+'</td><td class="num">'+m(vb)+'</td>'
       + '<td class="num'+(d?' dif':'')+'">'+(d?m(d):'—')+'</td></tr>';
}

  }
  return h;
}

<script>

     + '<tr class="tt"><td>Total de imposto a declarar</td><td class="num">'+gs.length+'</td><td class="num">—</td><td class="num">'+m(r2(gSem.r+gCom.r+gNp.r))+'</td><td class="num">—</td></tr>'

    h += '<table class="mini"><thead><tr><th>Contrato</th><th>Unidade</th><th class="num">Imposto previsto</th><th class="num">Imposto recalculado</th><th class="num">Diferença</th><th>Motivo</th></tr></thead><tbody>';
    comDiv.forEach(function(nt){

function podeContinuar(w){ return w.nome && w.emps.length && w.ccs.length && w.ini && w.fim; }
function dt(s){
  const p = String(s||'').split('/');
  if(p.length!==3) return null;
  const d = new Date(+p[2], +p[1]-1, +p[0]);
  return isNaN(d.getTime()) ? null : d;
}
function sobrepoe(a1,a2,b1,b2){
  const A1=dt(a1), A2=dt(a2), B1=dt(b1), B2=dt(b2);
  if(!A1||!A2||!B1||!B2) return true;
  return A1<=B2 && B1<=A2;
}
function conflitoRecorte(w){
  if(!w.emps.length || !w.ccs.length || !w.ini || !w.fim) return null;
  return S.ag.find(function(a){
    return a.ativo && intersec(a.emps, w.emps).length && intersec(a.ccs, w.ccs).length && sobrepoe(w.ini,w.fim,a.ini,a.fim);
  }) || null;
}
function contratosDoRecorte(w){
  const map = {};
  P.filter(function(p){ return w.emps.indexOf(p.emp)>=0 && w.ccs.indexOf(p.cc)>=0 && p.nat==='Aluguel'; }).forEach(function(p){
    if(!map[p.ct]) map[p.ct] = {ct:p.ct, cli:p.cli, uns:0, n:0, semPrev:false, _u:{}, _e:{}, _c:{}};
    map[p.ct]._u[p.un]=1; map[p.ct]._e[p.emp]=1; map[p.ct]._c[p.cc]=1; map[p.ct].n++;
    if(!temPrevisao(p)) map[p.ct].semPrev = true;
  });
  return Object.keys(map).map(function(k){ const o=map[k]; o.uns=Object.keys(o._u).length; return o; });
}

  S.vencDeAp = String(S.vencDe||'').trim(); S.vencAteAp = String(S.vencAte||'').trim();
  S.cobAp = S.cob;
  S.semResultado = (visiveisDoChip('todas').length === 0);
  render(); scrollTop();
  const n = alugueisDoRecorte('todas').length;
  const jan = janelaTexto(S.vencDeAp, S.vencAteAp);
  snack(S.semResultado
    ? 'Nenhuma parcela de locação no recorte, vencimento '+jan+'.'
    : n+' parcela'+(n===1?'':'s')+' de locação encontrada'+(n===1?'':'s')+', vencimento '+jan+'.');
}

function confirmarEmissao(){
  const gs = grupos(selecionadas());
  abrirMod('Emitir notas de locação', modConfirmar(),
    '<button class="btn txt" onclick="fecharMod()">Cancelar</button>'
    + '<button class="btn pri" onclick="emitir()">Emitir '+gs.length+' nota'+(gs.length>1?'s':'')+'</button>');

function emitir(){
  fecharMod();
  const gs = grupos(selecionadas());
  if(!gs.length) return;
  S.emitindo = {notas:gs.length, feito:0};
  S.resultado = null;
  render(); scrollTop();
  const passo = function(){
    S.emitindo.feito = Math.min(S.emitindo.notas, S.emitindo.feito + 1);
    render();
    if(S.emitindo.feito < S.emitindo.notas) setTimeout(passo, Math.max(90, 900/S.emitindo.notas));
    else setTimeout(function(){ concluirEmissao(gs); }, 420);
  };
  setTimeout(passo, 300);
}
function concluirEmissao(gs){
  let seq = 184400;
  const R = {conf:[], rej:[], proc:[], rejNotas:0, confParc:0, semPrevParc:0,
             total:gs.length, quando:'12/08/2026 às '+hora(0)};
  gs.forEach(function(g, i){
    const temPend = g.itens.some(function(p){ return !!p.pend; });
    if(temPend){
      R.rejNotas++;
      g.itens.forEach(function(p){
        arquivarTentativa(p);
        p.nota = {ch:'sem chave, rejeitada na validação', est:'Rejeitada', dt:'12/08/2026 '+hora(i), cobre:g.itens.map(function(x){ return x.id; })};
        R.rej.push(p);
      });
      return;
    }
    seq++;
    const ch = g.cmun+'-NFSE-2026-'+String(seq).padStart(10,'0');
    const emProc = (i % 4 === 3);
    g.itens.forEach(function(p){
      if(!temPrevisao(p)){ p.prev = true; R.semPrevParc++; }
      if(p.prevVl !== undefined) delete p.prevVl;
      arquivarTentativa(p);
      p.nota = {ch:ch, est: emProc?'Em processamento':'Confirmada', dt:'12/08/2026 '+hora(i),
                cobre:g.itens.map(function(x){ return x.id; })};
      if(!emProc) R.confParc++;
    });
    (emProc ? R.proc : R.conf).push(g);
  });
  S.emitindo = false; S.resultado = R;
  S.sel.clear(); S.chip = 'todas';
  render(); scrollTop();
  snack(R.total+' nota'+(R.total===1?'':'s')+' no lote: '+R.conf.length+' confirmada'+(R.conf.length===1?'':'s')+', '+R.proc.length+' em processamento e '+R.rejNotas+' rejeitada'+(R.rejNotas===1?'':'s')+'.');
}
function hora(i){ return '09:'+String(20+(i%30)).padStart(2,'0'); }
function fecharResultado(){ S.resultado=null; render(); }
function corrigir(id){
  const p = P.find(function(x){ return x.id===id; });
  arquivarTentativa(p);
  p.pend = null; S.sel.add(p.id);
  if(S.resultado){
    S.resultado.rej = S.resultado.rej.filter(function(x){ return x.id!==id; });
    const notasRej = {};
    S.resultado.rej.forEach(function(x){ notasRej[(x.nota && x.nota.cobre ? x.nota.cobre.join(',') : x.id)] = 1; });
    S.resultado.rejNotas = Object.keys(notasRej).length;
  }
  render();
  snack('Cadastro corrigido. A parcela voltou para a seleção, pronta para reenvio.', 'Reenviar', reenviar);
}

let snackT;
function snack(msg, acao, fn){
  const el = document.getElementById('snack');
  el.innerHTML = '<span>'+msg+'</span>'+(acao?'<span class="sa" id="snackA">'+acao+'</span>':'');
  el.classList.add('on');
  if(acao) document.getElementById('snackA').onclick = function(){ el.classList.remove('on'); fn(); };
  clearTimeout(snackT);
  snackT = setTimeout(function(){ el.classList.remove('on'); }, acao?9000:5000);
}
(function(){
  const tip = document.getElementById('tip');
  document.addEventListener('mouseover', function(ev){
    const t = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if(!t) return;
    tip.innerHTML = t.dataset.tip;
    const r = t.getBoundingClientRect();
    tip.style.display='block';
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    let x = r.left, y = r.bottom + 6;
    if(x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
    if(y + hh > window.innerHeight - 8) y = r.top - hh - 6;
    tip.style.left = Math.max(8,x)+'px'; tip.style.top = Math.max(8,y)+'px';
  });
  document.addEventListener('mouseout', function(ev){
    if(ev.target.closest && ev.target.closest('[data-tip]')) tip.style.display='none';
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape'){ fecharMod(); fecharDrawer(); }
  });
})();

<script>

}
(function(){
var MENU={
 2:['Engenharia',['Custos Unitários','Orçamento','Planejamento','Acompanhamento','Diário de Obra','Controle de Mão de Obra','Exportações e Importações','Integração BIM','Apoio']],

 7:['Comercial',['Gestão de Unidades','Pró-vendas','Vendas','Ativos Imobiliários*','Locação de Imóveis','Assistência Técnica','Gestão de Condomínios','Apoio']],
 8:['Gerencial',['Gerencial Financeiro','Gerencial de Obras','Gerencial Suprimentos','Orçamento Empresarial','Viabilidade Econômica','Acompanhamento de Viabilidade','Apoio']]
};
var LEAFS = {
  'Emissão de NFS-e':[
    {t:'Emissão'},
    {t:'Configurações para título'},
    {t:'Emissão da nota de locação', novo:true, tela:'emissao'},

  ]
};

<script>
(function(){
  window.clarity = window.clarity || function(){ (window.clarity.q = window.clarity.q || []).push(arguments); };
  function ev(n){ try { window.clarity('event', n); } catch(e){} }
  function tag(k, v){ try { window.clarity('set', k, v); } catch(e){} }
  function lim(x){ return String(x == null ? '' : x).replace(/[^A-Za-z0-9_]/g, '').slice(0, 24); }
  tag('prototipo', 'loc_v15_teste_r1');
  try { var p = new URLSearchParams(location.search).get('p'); if (p && /^[A-Za-z0-9_-]{1,12}$/.test(p)) tag('participante', p); } catch(e){}
  var modalEmissao = false;
  function antes(nome, fn){
    var orig = window[nome];
    if (typeof orig !== 'function') return;
    window[nome] = function(){ try { fn.apply(this, arguments); } catch(e){} return orig.apply(this, arguments); };
  }
  function depois(nome, fn){
    var orig = window[nome];
    if (typeof orig !== 'function') return;
    window[nome] = function(){ var r = orig.apply(this, arguments); try { fn.apply(this, arguments); } catch(e){} return r; };
  }
  depois('consultar', function(){ ev(S.consultado ? 'loc_consulta_ok' : 'loc_consulta_erro'); });
  antes('setChip', function(k){ ev('loc_chip_' + lim(k)); });
  antes('ordenar', function(c){ ev('loc_ordenar_' + lim(c)); });
  antes('confirmarEmissao', function(){ modalEmissao = true; ev('loc_emissao_modal'); });
  antes('emitir', function(){ modalEmissao = false; ev('loc_emissao_confirmada'); });
  antes('fecharMod', function(){ if (modalEmissao) { modalEmissao = false; ev('loc_emissao_cancelada'); } });
  antes('concluirEmissao', function(){ ev('loc_resultado_lote'); });
  antes('abrirDetalhe', function(){ ev('loc_drawer_nota'); });
  antes('irAgendamento', function(){ ev('loc_agendamento'); });
  window.addEventListener('error', function(){ ev('loc_erro_js'); });
})();
